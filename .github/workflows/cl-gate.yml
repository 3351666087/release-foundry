name: CL Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cl-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan and hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.plan.outputs.full }}
      python: ${{ steps.plan.outputs.python }}
      a3: ${{ steps.plan.outputs.a3 }}
      typescript: ${{ steps.plan.outputs.typescript }}
      go: ${{ steps.plan.outputs.go }}
      rust: ${{ steps.plan.outputs.rust }}
      integration: ${{ steps.plan.outputs.integration }}
      evidence: ${{ steps.plan.outputs.evidence }}
      changed_count: ${{ steps.plan.outputs.changed_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build selective CL plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            FULL=""
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            FULL="--full"
          fi
          python scripts/cl_guard.py plan --base "$BASE" --head HEAD $FULL --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      - name: High-confidence hygiene blockers
        run: python scripts/cl_guard.py hygiene

  python-a1-a2:
    name: Python A1/A2 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.python == 'true' || needs.plan.outputs.integration == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Compile Python sources
        run: python -m compileall packages services scripts tests
      - name: Run Python contracts
        run: python -B -m pytest tests/a1 tests/a2 tests/integration/test_a1_large_saas_migration.py -q -p no:cacheprovider

  a3-node:
    name: A3 dashboard/report/evidence contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.a3 == 'true' || needs.plan.outputs.evidence == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run A3 Node contracts
        run: node --test tests/a3/*.mjs

  typescript-sdk:
    name: TypeScript SDK parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.typescript == 'true'
    defaults:
      run:
        working-directory: packages/ts/ashr-clone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/ts/ashr-clone/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build and test TypeScript SDK
        run: npm test

  go-sdk:
    name: Go SDK and integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.go == 'true' || needs.plan.outputs.integration == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            packages/go/ashrclone/go.mod
            tests/integration/go/go.mod
      - name: Test Go SDK
        working-directory: packages/go/ashrclone
        run: go test ./...
      - name: Test Go integration
        working-directory: tests/integration/go
        run: go test ./...

  rust-verifier:
    name: Rust verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    defaults:
      run:
        working-directory: packages/rust/ashr-runtime-verify
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust stable
        run: |
          rustup default stable
          rustc --version
          cargo --version
      - name: Test Rust verifier
        run: cargo test --quiet

  evidence-gate:
    name: A3 pinned evidence verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: plan
    if: needs.plan.outputs.evidence == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify committed A3 audit bundle
        run: |
          node services/report/a3_gate_cli.mjs \
            --verify-index fixtures/a3/p3/a3_audit_bundle_index_blocked_exception.redacted.json \
            --generated-at 2026-07-07T00:00:00.000Z \
            --strict-exit \
            --json

  cl-summary:
    name: CL Gate summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - plan
      - python-a1-a2
      - a3-node
      - typescript-sdk
      - go-sdk
      - rust-verifier
      - evidence-gate
    steps:
      - name: Summarize required results
        shell: bash
        run: |
          set -euo pipefail
          echo "plan=${{ needs.plan.result }}"
          echo "python-a1-a2=${{ needs.python-a1-a2.result }}"
          echo "a3-node=${{ needs.a3-node.result }}"
          echo "typescript-sdk=${{ needs.typescript-sdk.result }}"
          echo "go-sdk=${{ needs.go-sdk.result }}"
          echo "rust-verifier=${{ needs.rust-verifier.result }}"
          echo "evidence-gate=${{ needs.evidence-gate.result }}"
          for result in \
            "${{ needs.plan.result }}" \
            "${{ needs.python-a1-a2.result }}" \
            "${{ needs.a3-node.result }}" \
            "${{ needs.typescript-sdk.result }}" \
            "${{ needs.go-sdk.result }}" \
            "${{ needs.rust-verifier.result }}" \
            "${{ needs.evidence-gate.result }}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              exit 1
            fi
          done
