name: CL Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cl-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan and hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.plan.outputs.full }}
      python: ${{ steps.plan.outputs.python }}
      a3: ${{ steps.plan.outputs.a3 }}
      typescript: ${{ steps.plan.outputs.typescript }}
      go: ${{ steps.plan.outputs.go }}
      rust: ${{ steps.plan.outputs.rust }}
      integration: ${{ steps.plan.outputs.integration }}
      evidence: ${{ steps.plan.outputs.evidence }}
      changed_count: ${{ steps.plan.outputs.changed_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build selective CL plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            FULL=""
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            FULL="--full"
          fi
          python scripts/cl_guard.py plan --base "$BASE" --head HEAD $FULL --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

      - name: High-confidence hygiene blockers
        run: python scripts/cl_guard.py hygiene

      - name: Commercial SaaS anchor blockers
        run: python scripts/cl_guard.py commercial

  python-a1-a2:
    name: Python A1/A2 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.python == 'true' || needs.plan.outputs.integration == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema
      - name: Compile Python sources
        run: python -m compileall packages services scripts tests
      - name: Run Python contracts
        run: python -B -m pytest tests/a1 tests/a2 tests/integration/test_a1_large_saas_migration.py -q -p no:cacheprovider

  a3-node:
    name: A3 dashboard/report/evidence contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.a3 == 'true' || needs.plan.outputs.evidence == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run A3 Node contracts
        run: node --test tests/a3/*.mjs

  a3-webapp:
    name: A3 Next.js and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.a3 == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/webapp/package-lock.json
      - name: Install root Playwright dependencies
        run: npm ci
      - name: Install A3 webapp dependencies
        run: npm ci --prefix apps/webapp
      - name: Typecheck and export A3 webapp
        run: npm run check --prefix apps/webapp
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run A3 route-level E2E
        run: npx playwright test tests/e2e/a3-webapp-product-routes.spec.ts

  typescript-sdk:
    name: TypeScript SDK parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: plan
    if: needs.plan.outputs.typescript == 'true'
    defaults:
      run:
        working-directory: packages/ts/ashr-clone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: packages/go/ashrclone/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/ts/ashr-clone/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build and test TypeScript SDK
        run: npm test

  go-sdk:
    name: Go SDK and integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: plan
    if: needs.plan.outputs.go == 'true' || needs.plan.outputs.integration == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: |
            packages/go/ashrclone/go.mod
            tests/integration/go/go.mod
      - name: Test Go SDK
        working-directory: packages/go/ashrclone
        run: go test ./...
      - name: Test Go integration
        working-directory: tests/integration/go
        run: go test ./...

  rust-verifier:
    name: Rust verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    defaults:
      run:
        working-directory: packages/rust/ashr-runtime-verify
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust stable
        run: |
          rustup default stable
          rustc --version
          cargo --version
      - name: Test Rust verifier
        run: cargo test --quiet

  evidence-gate:
    name: A3 pinned evidence verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: plan
    if: needs.plan.outputs.evidence == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify committed A3 audit bundle
        run: |
          node services/report/a3_gate_cli.mjs \
            --verify-index fixtures/a3/p3/a3_audit_bundle_index_blocked_exception.redacted.json \
            --generated-at 2026-07-07T00:00:00.000Z \
            --strict-exit \
            --json

  a3-release-delivery:
    name: A3 golden path release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: plan
    if: needs.plan.outputs.a3 == 'true' || needs.plan.outputs.evidence == 'true'
    env:
      A3_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      A3_CI_TESTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build new-run gate and Audit Bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/a3-release-delivery
          node services/report/a3_gate_cli.mjs \
            --runs fixtures/a3/golden-path/a3_new_run_result.redacted.json \
            --grades fixtures/a3/golden-path/a2_new_run_judge_response.redacted.json \
            --coverage fixtures/a2/results/a2_g3_coverage_report.json \
            --thresholds fixtures/a3/release_gate_thresholds.json \
            --a2-trusted-spine fixtures/a2/results/a2_trusted_spine_handoff.json \
            --github-check-readback fixtures/a3/p3/a3_github_check_readback_confirmed.redacted.json \
            --github-pr-comment-readback fixtures/a3/p3/a3_github_pr_comment_readback_confirmed.redacted.json \
            --github-required-check-proof fixtures/a3/p3/a3_github_required_check_proof_plan_only.redacted.json \
            --deployment-probe fixtures/a3/golden-path/deployment_probe.redacted.json \
            --release-version 0.2.0-rc.1 \
            --environment staging \
            --source a3-golden-path \
            --generated-at 2026-07-12T12:00:00.000Z \
            --head-sha "${A3_CANDIDATE_SHA}" \
            --details-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --annotation-path docs/a3/a3_release_delivery_golden_path_2026_07_12.md \
            --output-json artifacts/a3-release-delivery/gate.json \
            --output-md artifacts/a3-release-delivery/gate.md \
            --output-check artifacts/a3-release-delivery/github-check.json \
            --output-pr-comment artifacts/a3-release-delivery/pr-comment.md \
            --output-manifest artifacts/a3-release-delivery/generated-artifacts.json \
            --output-bundle artifacts/a3-release-delivery/audit-bundle-index.json \
            --no-fail \
            --json
          node services/report/a3_gate_cli.mjs \
            --verify-index artifacts/a3-release-delivery/audit-bundle-index.json \
            --generated-at 2026-07-12T12:00:01.000Z \
            --output-json artifacts/a3-release-delivery/audit-bundle-verification.json \
            --strict-exit \
            --json
          node services/report/a3_audit_archive.mjs \
            --index artifacts/a3-release-delivery/audit-bundle-index.json \
            --output artifacts/a3-release-delivery/audit-archive-manifest.json \
            --generated-at 2026-07-12T12:00:02.000Z \
            --source github-actions \
            --json
          node services/report/a3_audit_archive.mjs \
            --verify artifacts/a3-release-delivery/audit-archive-manifest.json \
            --output artifacts/a3-release-delivery/audit-archive-verification.json \
            --generated-at 2026-07-12T12:00:03.000Z \
            --json
      - name: Build deployment acceptance and release artifact
        run: |
          node services/report/a3_release_delivery_cli.mjs \
            --runs fixtures/a3/golden-path/a3_new_run_result.redacted.json \
            --grades fixtures/a3/golden-path/a2_new_run_judge_response.redacted.json \
            --trusted-spine fixtures/a2/results/a2_trusted_spine_handoff.json \
            --audit-bundle artifacts/a3-release-delivery/audit-bundle-index.json \
            --audit-bundle-verification artifacts/a3-release-delivery/audit-bundle-verification.json \
            --audit-archive artifacts/a3-release-delivery/audit-archive-manifest.json \
            --audit-archive-verification artifacts/a3-release-delivery/audit-archive-verification.json \
            --github-check-readback fixtures/a3/p3/a3_github_check_readback_confirmed.redacted.json \
            --github-pr-comment-readback fixtures/a3/p3/a3_github_pr_comment_readback_confirmed.redacted.json \
            --github-required-check-proof fixtures/a3/p3/a3_github_required_check_proof_plan_only.redacted.json \
            --deployment-probe fixtures/a3/golden-path/deployment_probe.redacted.json \
            --release-version 0.2.0-rc.1 \
            --environment staging \
            --git-sha "${A3_CANDIDATE_SHA}" \
            --ci-tested-sha "${A3_CI_TESTED_SHA}" \
            --generated-at 2026-07-12T12:00:04.000Z \
            --verified-at 2026-07-12T12:00:05.000Z \
            --output-dir artifacts/a3-release-delivery/release \
            --doc docs/strategy/large-saas-a1-a2-a3-full-plan.md \
            --doc docs/a3/a3_release_delivery_golden_path_2026_07_12.md \
            --doc docs/a3/releases/a3-0.2.0-rc.1.md \
            --no-fail \
            --json
      - name: Upload versioned release candidate packet
        uses: actions/upload-artifact@v4
        with:
          name: ashr-a3-0.2.0-rc.1-${{ env.A3_CANDIDATE_SHA }}
          path: artifacts/a3-release-delivery
          if-no-files-found: error
          retention-days: 14

  cl-summary:
    name: CL Gate summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - plan
      - python-a1-a2
      - a3-node
      - a3-webapp
      - typescript-sdk
      - go-sdk
      - rust-verifier
      - evidence-gate
      - a3-release-delivery
    steps:
      - name: Summarize required results
        shell: bash
        run: |
          set -euo pipefail
          echo "plan=${{ needs.plan.result }}"
          echo "python-a1-a2=${{ needs.python-a1-a2.result }}"
          echo "a3-node=${{ needs.a3-node.result }}"
          echo "a3-webapp=${{ needs.a3-webapp.result }}"
          echo "typescript-sdk=${{ needs.typescript-sdk.result }}"
          echo "go-sdk=${{ needs.go-sdk.result }}"
          echo "rust-verifier=${{ needs.rust-verifier.result }}"
          echo "evidence-gate=${{ needs.evidence-gate.result }}"
          echo "a3-release-delivery=${{ needs.a3-release-delivery.result }}"
          for result in \
            "${{ needs.plan.result }}" \
            "${{ needs.python-a1-a2.result }}" \
            "${{ needs.a3-node.result }}" \
            "${{ needs.a3-webapp.result }}" \
            "${{ needs.typescript-sdk.result }}" \
            "${{ needs.go-sdk.result }}" \
            "${{ needs.rust-verifier.result }}" \
            "${{ needs.evidence-gate.result }}" \
            "${{ needs.a3-release-delivery.result }}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              exit 1
            fi
          done
