{{- $root := . -}}
{{- range $component := list "api" "queue-worker" "identity-delivery" "migration" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "releasefoundry.componentName" (dict "root" $root "component" $component) }}
  labels:
    {{- include "releasefoundry.commonLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  annotations:
    {{- include "releasefoundry.supplyChainAnnotations" $root | nindent 4 }}
    {{- with $root.Values.serviceAccounts.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "releasefoundry.fullname" . }}-no-kubernetes-api-access
  labels:
    {{- include "releasefoundry.commonLabels" . | nindent 4 }}
rules: []
{{- range $component := list "api" "queue-worker" "identity-delivery" "migration" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "releasefoundry.componentName" (dict "root" $root "component" $component) }}-no-api
  labels:
    {{- include "releasefoundry.commonLabels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
subjects:
  - kind: ServiceAccount
    name: {{ include "releasefoundry.componentName" (dict "root" $root "component" $component) }}
    namespace: {{ $root.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "releasefoundry.fullname" $root }}-no-kubernetes-api-access
{{- end }}
