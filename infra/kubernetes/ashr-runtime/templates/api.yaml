apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ashr.componentName" (dict "root" . "component" "api") }}
  labels:
    {{- include "ashr.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    {{- include "ashr.supplyChainAnnotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: 5
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "ashr.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ashr.selectorLabels" (dict "root" . "component" "api") | nindent 8 }}
        networking.ashr.io/api-client: "true"
      annotations:
        checksum/runtime-config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- include "ashr.supplyChainAnnotations" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "ashr.componentName" (dict "root" . "component" "api") }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        {{- include "ashr.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        {{- include "ashr.topologySpread" (dict "root" . "component" "api") | nindent 8 }}
      {{- with .Values.scheduling.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduling.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "ashr.image" .Values.images.api | quote }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["/usr/local/bin/ashr-api"]
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          env:
            - name: ASHR_GO_API_ADDR
              value: 0.0.0.0:8787
            - name: ASHR_GO_BACKEND
              value: postgres
            - name: ASHR_ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: ASHR_IDENTITY_RUNTIME
              value: postgres
            - name: ASHR_IDENTITY_SESSION_HMAC_ACTIVE_VERSION
              value: {{ .Values.api.identity.activeSessionKeyVersion | quote }}
            - name: ASHR_IDENTITY_SESSION_HMAC_LEGACY_VERSION
              value: {{ .Values.api.identity.legacySessionKeyVersion | quote }}
            - name: ASHR_IDENTITY_VERIFICATION_ENABLED
              value: {{ .Values.api.identity.verificationEnabled | quote }}
            - name: ASHR_IDENTITY_SESSION_COOKIE_MAX_AGE_SECONDS
              value: {{ .Values.api.identity.cookieMaxAgeSeconds | quote }}
            - name: ASHR_IDENTITY_REFRESH_COOKIE_MAX_AGE_SECONDS
              value: {{ .Values.api.identity.refreshCookieMaxAgeSeconds | quote }}
            - name: ASHR_IDENTITY_SESSION_COOKIE_TRUSTED_PROXY_CIDRS
              value: {{ .Values.api.identity.trustedProxyCidrs | quote }}
            - name: ASHR_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtime.secrets.runtime.name }}
                  key: {{ .Values.runtime.secrets.runtime.postgresDsnKey }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtime.secrets.runtime.name }}
                  key: {{ .Values.runtime.secrets.runtime.postgresDsnKey }}
            - name: ASHR_IDENTITY_SESSION_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtime.secrets.runtime.name }}
                  key: {{ .Values.runtime.secrets.runtime.sessionHmacKey }}
            - name: ASHR_IDENTITY_SESSION_HMAC_PREVIOUS_KEYS_JSON
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtime.secrets.runtime.name }}
                  key: {{ .Values.runtime.secrets.runtime.previousSessionKeysKey }}
                  optional: true
            {{- if .Values.api.identity.verificationEnabled }}
            - name: ASHR_IDENTITY_VERIFICATION_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtime.secrets.runtime.name }}
                  key: {{ .Values.runtime.secrets.runtime.evidenceHmacKey }}
            - name: ASHR_IDENTITY_VERIFICATION_ORGANIZATION_ID
              value: {{ .Values.runtime.tenantId | quote }}
            - name: ASHR_IDENTITY_VERIFICATION_PROJECT_ID
              value: {{ .Values.runtime.projectId | quote }}
            - name: ASHR_IDENTITY_VERIFICATION_PRINCIPAL_ID
              value: identity-verification-api
            - name: ASHR_IDENTITY_DELIVERY_VAULT_SEAL_URL
              value: {{ .Values.api.identity.vaultSealUrl | quote }}
            - name: ASHR_IDENTITY_DELIVERY_VAULT_DELETE_URL
              value: {{ .Values.api.identity.vaultDeleteUrl | quote }}
            - name: ASHR_IDENTITY_DELIVERY_VAULT_MTLS_CA_FILE
              value: /var/run/secrets/ashr/identity-mtls/ca.pem
            - name: ASHR_IDENTITY_DELIVERY_VAULT_MTLS_CLIENT_CERT_FILE
              value: /var/run/secrets/ashr/identity-mtls/client-cert.pem
            - name: ASHR_IDENTITY_DELIVERY_VAULT_MTLS_CLIENT_KEY_FILE
              value: /var/run/secrets/ashr/identity-mtls/client-key.pem
            - name: ASHR_IDENTITY_DELIVERY_VAULT_MTLS_SERVER_NAME
              value: {{ .Values.identityDelivery.mtlsServerName | quote }}
            {{- end }}
          securityContext:
            {{- include "ashr.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            failureThreshold: 3
            periodSeconds: 15
            timeoutSeconds: 2
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
            {{- if .Values.api.identity.verificationEnabled }}
            - name: identity-mtls
              mountPath: /var/run/secrets/ashr/identity-mtls
              readOnly: true
            {{- end }}
      volumes:
        - name: runtime-tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.api.identity.verificationEnabled }}
        - name: identity-mtls
          secret:
            secretName: {{ .Values.runtime.secrets.identityMtls.name }}
            defaultMode: 0440
            items:
              - key: {{ .Values.runtime.secrets.identityMtls.caKey }}
                path: ca.pem
              - key: {{ .Values.runtime.secrets.identityMtls.certificateKey }}
                path: client-cert.pem
              - key: {{ .Values.runtime.secrets.identityMtls.privateKeyKey }}
                path: client-key.pem
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ashr.componentName" (dict "root" . "component" "api") }}
  labels:
    {{- include "ashr.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    {{- include "ashr.supplyChainAnnotations" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ashr.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  internalTrafficPolicy: Cluster
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "ashr.componentName" (dict "root" . "component" "api") }}
  labels:
    {{- include "ashr.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  unhealthyPodEvictionPolicy: IfHealthyBudget
  selector:
    matchLabels:
      {{- include "ashr.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
