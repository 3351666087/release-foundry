apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ashr.fullname" . }}-runtime
  labels:
    {{- include "ashr.commonLabels" . | nindent 4 }}
  annotations:
    {{- include "ashr.supplyChainAnnotations" . | nindent 4 }}
immutable: true
data:
  ASHR_RUNTIME_ENV: {{ .Values.environment | quote }}
  ASHR_ENVIRONMENT: {{ .Values.environment | quote }}
  ASHR_SECRET_PROVIDER: kubernetes-secret-ref
  ASHR_POSTGRES_HOST: {{ .Values.runtime.postgres.host | quote }}
  ASHR_POSTGRES_PORT: {{ .Values.runtime.postgres.port | quote }}
  ASHR_POSTGRES_DB: {{ .Values.runtime.postgres.database | quote }}
  ASHR_POSTGRES_USER: {{ .Values.runtime.postgres.user | quote }}
  ASHR_QUEUE_ENDPOINT: {{ .Values.runtime.queue.endpoint | quote }}
  ASHR_OBJECT_STORE_ENDPOINT: {{ .Values.runtime.objectStorage.endpoint | quote }}
  ASHR_OBJECT_STORE_BUCKET: {{ .Values.runtime.objectStorage.bucket | quote }}
  ASHR_OBJECT_EVIDENCE_PREFIX: {{ .Values.runtime.objectStorage.evidencePrefix | quote }}
  ASHR_IDENTITY_DELIVERY_VAULT_URL: {{ .Values.identityDelivery.vaultUrl | quote }}
  ASHR_IDENTITY_DELIVERY_EMAIL_RELAY_URL: {{ .Values.identityDelivery.emailRelayUrl | quote }}
  ASHR_IDENTITY_DELIVERY_SMS_RELAY_URL: {{ .Values.identityDelivery.smsRelayUrl | quote }}
  ASHR_IDENTITY_DELIVERY_MTLS_SERVER_NAME: {{ .Values.identityDelivery.mtlsServerName | quote }}
