name: ashr-live-refund-demo

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:${ASHR_DEMO_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ashr-refund-demo-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  demo-runner:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.refund-agent-demo
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      OLLAMA_TIMEOUT_SECONDS: "180"
    volumes:
      - ../../.demo-output/live-refund:/output
    security_opt:
      - no-new-privileges:true

volumes:
  ashr-refund-demo-models:
