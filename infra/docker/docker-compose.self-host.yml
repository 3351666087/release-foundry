name: ashr-a1-self-host

x-ashr-runtime-env: &ashr-runtime-env
  ASHR_RUNTIME_ENV: self-host
  ASHR_SECRET_PROVIDER: env-ref
  ASHR_CONTROL_PLANE_BASE_URL: http://api:8080
  ASHR_DATABASE_URL_REF: env:ASHR_DATABASE_URL
  ASHR_DATABASE_URL: postgresql://ashr@postgres:5432/ashr?sslmode=disable
  ASHR_POSTGRES_DSN_REF: env:ASHR_DATABASE_URL
  ASHR_REDIS_URL: redis://redis:6379/0
  ASHR_REDIS_URL_REF: env:ASHR_REDIS_URL
  ASHR_OBJECT_STORE_URL: http://minio:9000
  ASHR_OBJECT_STORE_ENDPOINT: http://minio:9000
  ASHR_OBJECT_STORE_ENDPOINT_REF: env:ASHR_OBJECT_STORE_ENDPOINT
  ASHR_OBJECT_STORE_BUCKET: ashr-local-artifacts
  ASHR_OBJECT_STORE_ACCESS_KEY_REF: env:ASHR_OBJECT_STORE_ACCESS_KEY
  ASHR_OBJECT_STORE_SECRET_KEY_REF: env:ASHR_OBJECT_STORE_SECRET_KEY
  ASHR_OBJECT_EVIDENCE_PREFIX: evidence/a1/self-host
  ASHR_QUOTA_LEDGER_TABLE: ashr_quota_ledger
  ASHR_ARTIFACT_MANIFEST_TABLE: ashr_artifact_manifests
  ASHR_WORKER_JOBS_TABLE: ashr_worker_jobs
  ASHR_BILLING_PROVIDER_SECRET_REF: env:ASHR_BILLING_PROVIDER_SECRET
  ASHR_BILLING_WEBHOOK_SECRET_REF: env:ASHR_BILLING_WEBHOOK_SECRET

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.python-runtime
    image: ashr/a1-python-runtime:local
    profiles: ["api", "commercial"]
    environment:
      <<: *ashr-runtime-env
      ASHR_API_HOST: 0.0.0.0
      ASHR_API_PORT: "8080"
    command:
      - python
      - -c
      - >-
        from services.api.control_plane import serve_control_plane_http;
        server = serve_control_plane_http('0.0.0.0', 8080);
        server.serve_forever()
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          from services.api.control_plane import SaaSControlPlaneService;
          assert SaaSControlPlaneService().health()['status'] == 'ok'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    image: ashr/a1-python-runtime:local
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.python-runtime
    profiles: ["worker", "daemon", "commercial"]
    environment:
      <<: *ashr-runtime-env
      ASHR_WORKER_MODE: daemon
      ASHR_WORKER_DAEMON: "true"
      ASHR_WORKER_QUEUE: ashr_worker_jobs
      ASHR_WORKER_HEALTHCHECK_PATH: /runtime/worker/healthy
      ASHR_WORKER_LEASE_SECONDS: "300"
      ASHR_WORKER_POLL_INTERVAL_SECONDS: "30"
      ASHR_WORKER_MAX_ATTEMPTS: "3"
      ASHR_WORKER_EVIDENCE_WRITES: object-store
      ASHR_REPLAY_STATE_INPUT: /runtime/state/cloud-state.json
      ASHR_REPLAY_STATE_OUTPUT: /runtime/state/cloud-state.replayed.json
      ASHR_REPLAY_OUTPUT_DIR: /runtime/replay
    command:
      - python
      - -m
      - services.api.cli
      - replay-queued
      - --state-input
      - /runtime/state/cloud-state.json
      - --state-output
      - /runtime/state/cloud-state.replayed.json
      - --agent
      - examples.agents.mock_agent:RespondingMockAgent
      - --tenant-id
      - tenant_self_host
      - --project-id
      - project_self_host
      - --dataset-id
      - dataset_self_host
      - --summary-output
      - /runtime/replay/summary.json
      - --fixture-output-dir
      - /runtime/replay/fixtures
      - --run-output-dir
      - /runtime/replay/runs
      - --max-runs
      - "10"
      - --queue-workers
      - "4"
      - --max-workers
      - "4"
      - --timeout
      - "30"
    volumes:
      - ashr-runtime-state:/runtime/state
      - ashr-replay-output:/runtime/replay
      - ashr-worker-health:/runtime/worker
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /runtime/worker/healthy || test -d /runtime/replay
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ashr
      POSTGRES_USER: ashr
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ashr-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashr -d ashr"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - ashr-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    volumes:
      - ashr-object-store:/data
    secrets:
      - minio_root_user
      - minio_root_password
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["api", "worker", "daemon", "commercial"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      ASHR_OBJECT_STORE_BUCKET: ashr-local-artifacts
    secrets:
      - minio_root_user
      - minio_root_password
    entrypoint:
      - /bin/sh
      - -lc
      - >-
        mc alias set local http://minio:9000 "$$(cat /run/secrets/minio_root_user)" "$$(cat /run/secrets/minio_root_password)" &&
        mc mb --ignore-existing "local/$${ASHR_OBJECT_STORE_BUCKET}" &&
        mc anonymous set none "local/$${ASHR_OBJECT_STORE_BUCKET}"

secrets:
  minio_root_user:
    environment: ASHR_OBJECT_STORE_ACCESS_KEY
  minio_root_password:
    environment: ASHR_OBJECT_STORE_SECRET_KEY

volumes:
  ashr-postgres-data:
  ashr-redis-data:
  ashr-runtime-state:
  ashr-replay-output:
  ashr-worker-health:
  ashr-object-store:
