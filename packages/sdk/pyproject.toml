[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "releasefoundry"
version = "0.1.0"
description = "Local-first SDK for ReleaseFoundry agent execution and evidence capture"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Null3351" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/3351666087/release-foundry"
Repository = "https://github.com/3351666087/release-foundry"
Issues = "https://github.com/3351666087/release-foundry/issues"

[project.scripts]
releasefoundry = "releasefoundry.saas_cli:main"

[tool.setuptools]
packages = ["releasefoundry"]
