[package]
name = "ashr-runtime-verify"
version = "0.1.0"
edition = "2021"
description = "Static Ashr A1 runtime fixture verifier and replay-plan utility."
license = "UNLICENSED"
publish = false

[dependencies]
hex = "0.4"
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
zeroize = "1.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.20"

[lib]
name = "ashr_runtime_verify"
path = "src/lib.rs"

[[bin]]
name = "ashr-runtime-verify"
path = "src/main.rs"
